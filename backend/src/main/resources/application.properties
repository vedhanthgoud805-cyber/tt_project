# Prescripto Spring Boot Application Configuration
spring.application.name=prescripto-backend
server.port=${PORT:4000}

# PostgreSQL Datasource Defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prescripto}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:prescripto}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:prescripto_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin Credentials
admin.email=${ADMIN_EMAIL:admin@prescripto.com}
admin.password=${ADMIN_PASSWORD:admin_secure_password}

# JWT Secret (Default fallback provided for dev safety)
jwt.secret=${JWT_SECRET:prescripto_super_secure_jwt_token_secret_key_2026_at_least_256_bits}

# Cloudinary (Optional)
cloudinary.cloud-name=${CLOUDINARY_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_SECRET_KEY:}

# Razorpay (Optional)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=${CURRENCY:INR}
